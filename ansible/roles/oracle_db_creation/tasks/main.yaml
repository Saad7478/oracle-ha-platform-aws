- name: Ensure oradata directory exists
  file:
    path: "{{ oracle_datafile_destination }}"
    state: directory
    owner: oracle
    group: oinstall
    mode: '0775'

- name: Run DBCA silent database creation
  become: yes
  become_user: oracle
  shell: |
    export ORACLE_HOME={{ oracle_home }}
    export ORACLE_SID={{ oracle_sid }}
    export PATH=$ORACLE_HOME/bin:$PATH

    dbca -silent \
    -createDatabase \
    -templateName General_Purpose.dbc \
    -gdbname {{ db_name }} \
    -sid {{ oracle_sid }} \
    -dbUniqueName {{ primary_unique_name }} \
    -createAsContainerDatabase true \
    -numberOfPDBs 1 \
    -pdbName {{ oracle_pdbname }} \
    -sysPassword {{ sys_password }} \
    -systemPassword {{ system_password }} \
    -pdbAdminPassword {{ pdbadmin_password }} \
    -databaseType MULTIPURPOSE \
    -automaticMemoryManagement false \
    -totalMemory {{ oracle_memory_mb }} \
    -storageType FS \
    -datafileDestination {{ oracle_datafile_destination }} \
    -characterSet {{ oracle_charset }} \
    -redoLogFileSize 20 \
    -emConfiguration NONE \
    -ignorePreReqs
  args:
    creates: "{{ oracle_home }}/dbs/spfile{{ oracle_sid }}.ora"
  register: dbca_result
  

- name: Debug DBCA stdout
  debug:
    var: dbca_result.stdout_lines

- name: Debug DBCA stderr
  debug:
    var: dbca_result.stderr_lines

- name: Debug DBCA return code
  debug:
    var: dbca_result.rc

# LISTENER AND TNSNAMES CONFIGURATION

- name: Configure listener.ora
  template:
    src: listener.ora.j2
    dest: "{{ oracle_home }}/network/admin/listener.ora"
    owner: oracle
    group: oinstall
    mode: '0644'

- name: Configure tnsnames.ora
  template:
    src: tnsnames.ora.j2
    dest: "{{ oracle_home }}/network/admin/tnsnames.ora"
    owner: oracle
    group: oinstall
    mode: '0644'

- name: Start Oracle listener
  become: yes
  become_user: oracle
  shell: |
    export ORACLE_HOME={{ oracle_home }}
    export PATH=$ORACLE_HOME/bin:$PATH

    lsnrctl start {{ listener_name }}
  failed_when: false

- name: Check listener status
  become: yes
  become_user: oracle
  shell: |
    export ORACLE_HOME={{ oracle_home }}
    export PATH=$ORACLE_HOME/bin:$PATH

    lsnrctl status {{ listener_name }}
  register: listener_status
  changed_when: false

- name: Debug listener status
  debug:
    var: listener_status.stdout_lines