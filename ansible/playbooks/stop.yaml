- name: "STOP Infrastructure"
  hosts: oracle_servers
  become: true
  become_user: oracle
  gather_facts: false

  roles:
    - role: ec2_oracle_control
      operation: stop
      tags: oracle

- name: "STOP EC2 AWS"
  hosts: localhost
  connection: local
  gather_facts: false

  roles:
    - role: ec2_oracle_control
      operation: stop
      tags: ec2